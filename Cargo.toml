[package]
name = "zcall-gui"
version = "0.1.11"
edition = "2024"
rust-version = "1.100"
description = "A small native control panel for the zcalld local AI gateway"
license = "MIT"
repository = "https://github.com/LIghtJUNction/zcall-gui"
[dependencies]
zi18n = { git = "https://github.com/LIghtJUNction/zi18n.git", default-features = false }
zconv = { git = "https://github.com/LIghtJUNction/zconv.git", default-features = false }
zgpui = {  features = ["native"], git = "https://github.com/LIghtJUNction/zgpui.git"}
zhex = { git = "https://github.com/LIghtJUNction/zhex.git" }
sha2 = { version = "0.11.1", default-features = false }
[workspace]
exclude = ["vendor/zgpui"]
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[target.'cfg(windows)'.dependencies]
zsys = { git = "https://github.com/LIghtJUNction/zsys.git" }
