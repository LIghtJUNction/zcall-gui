name: Release candidate (manual)
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Full commit SHA; blank uses current main
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: zcall-gui-release-candidate
  cancel-in-progress: false
jobs:
  native:
    uses: ./.github/workflows/native.yml
    with:
      ref: ${{ inputs.ref || github.sha }}
