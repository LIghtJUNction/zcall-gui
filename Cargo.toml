[package]
name = "zcall-gui"
version = "0.1.3"
edition = "2024"
rust-version = "1.100"
description = "A small native control panel for the zcalld local AI gateway"
license = "MIT"
repository = "https://github.com/LIghtJUNction/zcall-gui"
[dependencies]
zgpui = { path = "vendor/zgpui", version = "=0.1.5", features = ["native"] }
[workspace]
exclude = ["vendor/zgpui"]
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
